name: Windows desktop package

on:
  pull_request:
    paths:
      - 'clients/openim/**'
      - 'integrations/deepseek-harness/desktop/**'
      - 'packages/contracts/**'
      - 'packages/constitution/**'
      - 'packages/research-skills/**'
      - 'agents/skills/**'
      - 'agents/roles/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'clients/openim/**'
      - 'integrations/deepseek-harness/desktop/**'
      - 'packages/contracts/**'
      - 'packages/constitution/**'
      - 'packages/research-skills/**'
      - 'agents/skills/**'
      - 'agents/roles/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build dependencies before the isolated client install
        run: corepack pnpm@11.21.0 run desktop:prepare
      # 固定版本的三方二进制走 GitHub Releases；缓存命中时完全不联网，
      # 既省掉每次几十到几百 MB 的下载，也避免 CDN 504 决定构建结果。
      - name: Cache pinned desktop tools
        uses: actions/cache@v4
        with:
          path: clients/openim/tools/.cache
          key: desktop-tools-${{ runner.os }}-tectonic-0.17.0-dsh-research-workbench-0.4.0
      - name: Stage pinned DSH and tools for offline plugin upgrade tests
        run: |
          node integrations/deepseek-harness/desktop/stage-runtime.mjs clients/openim
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "import {prepareTools} from './scripts/desktop-tools.mjs'; await prepareTools('clients/openim');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check client types and build failure guards
        working-directory: clients/openim
        run: |
          corepack pnpm@10.28.0 run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run typecheck:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:local-dsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:task-views
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:team-library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:dsh-plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:chat-history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/chat-acknowledgement.test.mjs tests/memory-presentation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:planner-chat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/chat-image-submission.test.mjs tests/chat-image-actions.test.mjs tests/image-paste.test.mjs tests/chat-quote-recovery.test.mjs tests/chat-screenshot.test.mjs tests/screenshot-editor.test.mjs tests/chat-file-actions.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/group-members.test.mjs tests/group-mentions.test.mjs tests/group-outbox.test.mjs tests/send-recovery.test.mjs tests/agent-file-recovery.test.mjs tests/desktop-proxy.test.mjs tests/desktop-transport.test.mjs tests/chat-message-compat.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/chat-attention.test.mjs tests/agent-chat-navigation.test.mjs tests/conversation-actions.test.mjs tests/contact-removal.test.mjs tests/contact-directory.test.mjs tests/contact-card.test.mjs tests/service-status-bridge.test.mjs tests/directory-navigation.test.mjs tests/task-notice-card.test.mjs tests/workbench-view.test.mjs tests/lab-standards.test.mjs tests/ppt-template.test.mjs tests/local-library.test.mjs tests/library-layout.test.mjs tests/workspace-availability.test.mjs tests/library-index.test.mjs tests/task-work-page.test.mjs tests/bundled-tools.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/builtin-methods.test.mjs tests/agent-starters.test.mjs tests/agent-role-documents.test.mjs tests/agent-card-actions.test.mjs tests/capability-center.test.mjs tests/library-agent.test.mjs tests/library-chat.test.mjs
          exit $LASTEXITCODE
      - name: Build NSIS and verify packaged CommonJS entries
        working-directory: clients/openim
        run: corepack pnpm@10.28.0 run build:win
      - name: Verify installer and updater metadata agree
        working-directory: clients/openim
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            node scripts/check-windows-update.mjs --allow-preview
          } else {
            node scripts/check-windows-update.mjs
          }
      - name: Start the packaged app with an isolated smoke profile
        working-directory: clients/openim
        run: |
          $desktopVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/electron-smoke.mjs "release/Base/$desktopVersion/win-unpacked/AcceptCat.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-package
          path: |
            clients/openim/release/Base/*/AcceptCat_*.exe
            clients/openim/release/Base/*/AcceptCat_*.exe.blockmap
            clients/openim/release/Base/*/latest.yml
          if-no-files-found: error
          retention-days: 7
