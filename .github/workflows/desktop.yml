name: Windows desktop package

on:
  pull_request:
    paths:
      - 'clients/openim/**'
      - 'integrations/deepseek-harness/desktop/**'
      - 'packages/contracts/**'
      - 'packages/research-skills/**'
      - 'agents/skills/**'
      - 'agents/roles/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'clients/openim/**'
      - 'integrations/deepseek-harness/desktop/**'
      - 'packages/contracts/**'
      - 'packages/research-skills/**'
      - 'agents/skills/**'
      - 'agents/roles/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build dependencies before the isolated client install
        run: corepack pnpm@11.21.0 run desktop:prepare
      - name: Check client types and build failure guards
        working-directory: clients/openim
        run: |
          corepack pnpm@10.28.0 run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run typecheck:electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:local-dsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:chat-history
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack pnpm@10.28.0 run test:planner-chat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/chat-image-submission.test.mjs tests/chat-image-actions.test.mjs tests/image-paste.test.mjs tests/chat-quote-recovery.test.mjs tests/chat-screenshot.test.mjs tests/chat-file-actions.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/group-members.test.mjs tests/group-mentions.test.mjs tests/group-outbox.test.mjs tests/send-recovery.test.mjs tests/desktop-proxy.test.mjs tests/desktop-transport.test.mjs tests/chat-message-compat.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/chat-attention.test.mjs tests/agent-chat-navigation.test.mjs tests/conversation-actions.test.mjs tests/contact-removal.test.mjs tests/contact-directory.test.mjs tests/contact-card.test.mjs tests/service-status-bridge.test.mjs tests/directory-navigation.test.mjs tests/task-notice-card.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/builtin-methods.test.mjs tests/agent-starters.test.mjs tests/agent-role-documents.test.mjs tests/agent-card-actions.test.mjs tests/capability-center.test.mjs tests/library-agent.test.mjs tests/library-chat.test.mjs
          exit $LASTEXITCODE
      - name: Build NSIS and verify packaged CommonJS entries
        working-directory: clients/openim
        run: corepack pnpm@10.28.0 run build:win
      - name: Verify installer and updater metadata agree
        working-directory: clients/openim
        run: node scripts/check-windows-update.mjs
      - name: Start the packaged app with an isolated smoke profile
        working-directory: clients/openim
        run: |
          $desktopVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/electron-smoke.mjs "release/Base/$desktopVersion/win-unpacked/AcceptCat.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-package
          path: |
            clients/openim/release/Base/*/AcceptCat_*.exe
            clients/openim/release/Base/*/AcceptCat_*.exe.blockmap
            clients/openim/release/Base/*/latest.yml
          if-no-files-found: error
          retention-days: 7
