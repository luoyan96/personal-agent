# Include from nginx's http context. Replace certificate and release paths.
# Log URI without query arguments: OpenIM WebSocket and S3 URLs contain tokens.
log_format research_chat '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $research_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name chat.acceptcat.com files.chat.acceptcat.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.acceptcat.com;
    ssl_certificate /etc/letsencrypt/live/chat.acceptcat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.acceptcat.com/privkey.pem;
    root /srv/research-chat/current/clients/openim/dist;
    index index.html;
    access_log /var/log/nginx/research-chat-access.log research_chat;
    client_max_body_size 16m;

    # OpenIM containers use their private network to deliver callbacks.
    location ^~ /api/v1/im/callback/ { return 404; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3217;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Trailing slash intentionally strips /im-api/ before forwarding.
    location ^~ /im-api/ {
        proxy_pass http://127.0.0.1:15002/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Official ThirdApi uses this fixed public base for /object/ redirects.
        # Override caller input; TLS is terminated here and the prefix stripped.
        proxy_set_header X-Request-Api https://chat.acceptcat.com/im-api;
        proxy_read_timeout 120s;
    }
    location = /im-ws {
        proxy_pass http://127.0.0.1:15001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $research_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Missing SDK binaries must return 404 instead of the SPA HTML document.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /wasm_exec.js { try_files $uri =404; add_header Cache-Control "no-cache" always; }
    location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl http2;
    server_name files.chat.acceptcat.com;
    ssl_certificate /etc/letsencrypt/live/files.chat.acceptcat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.chat.acceptcat.com/privkey.pem;
    access_log /var/log/nginx/research-chat-media-access.log research_chat;
    # Explicit operational limit; file types are unrestricted by the client.
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:15005;
        # Preserve external host, path and signed query for S3 authorization.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
